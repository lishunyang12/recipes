guide: |
  ## Quick start

  MiniMax H3 jointly generates H.264 video and native stereo audio. Use the command matrix
  above as the primary workflow:

  1. Select **Request Mode** first. T2VA and all FL2VA modes use the `FL2VA` DiT;
     reference modes use the `Ref2VA` DiT.
  2. Select the exact **Hardware** profile. The generated command resolves placement,
     parallelism, attention backend, and whether one or both DiTs are loaded.
  3. Keep **BF16** for the accuracy reference, or select **FP8 (online)** when memory
     capacity matters and the target hardware has been qualified.
  4. Run the generated serve command, open **cURL**, and submit the matching five-second
     request. The seven presets share 50 denoising steps and fixed seeds for comparison.

  The B300 hardware profile describes an eight-GPU host. The generated resident command
  intentionally uses **4 of those GPUs**; `--num-gpus 4` is the runtime allocation, not a
  claim that all eight cards are required.

  The checkpoint contains two DiT backbones and shared supporting components:

  | DiT | Tasks | Conditioning |
  |---|---|---|
  | `FL2VA` | `t2va`, `fl2va` | text only, or text + first/last frame |
  | `Ref2VA` | `ref2va` | text + omni references (images, video clips, audio clips) |

  Serving `/path/to/MiniMax-H3` loads both DiTs by default and shares the Qwen3-VL encoder
  and video/audio VAEs. Capacity profiles add `--task-type fl2va` or `ref2va` automatically,
  so those servers expose one task family and must be restarted to switch families.

  Components (BF16): two 52-block joint video/audio DiTs (66.3 GB each), a shared
  Qwen3-VL layer-50 text/vision encoder (51.5 GB), a video VAE (~10 GB), and an audio
  VAE (~0.6 GB).

  ## Request modes

  | Picker option | `task` | Inputs | Loaded DiT |
  |---|---|---|---|
  | T2VA - Text | `t2va` | text | FL2VA |
  | FL2VA - First Frame | `fl2va` | one image, default index `[0]` | FL2VA |
  | FL2VA - Last Frame | `fl2va` | one image, `frame_indices=[-1]` | FL2VA |
  | FL2VA - First + Last | `fl2va` | two ordered images, `[0,-1]` | FL2VA |
  | Ref2VA - Image | `ref2va` | image reference | Ref2VA |
  | Ref2VA - Image + Audio | `ref2va` | image plus separate audio | Ref2VA |
  | Ref2VA - Video / Mixed | `ref2va` | ordered video or mixed references | Ref2VA |

  All generated examples request 5 seconds at 24 FPS with synchronized stereo audio,
  50 steps, `flow_shift=12`, and `audio_flow_shift=3`. Use `/v1/videos/sync` to receive the
  MP4 directly or `/v1/videos` for asynchronous job polling.

  ### Input and output limits

  - Output duration: 4–15 seconds. H3 snaps the request to its legal `17n+5` frame count.
  - Prompt: up to 7,000 characters.
  - Output canvas: 32-pixel multiples. Use a 768- or 1440-pixel short edge and one of
    21:9, 16:9, 4:3, 1:1, 3:4, or 9:16. FL2VA can inherit the image aspect ratio.
  - FL2VA: one first frame, one last frame, or an ordered first+last pair. Input edges must
    be in `[256, 5760]` with an aspect ratio from 5:2 to 2:5.

  **Omni Reference** — up to 9 images; up to 3 video clips (2–15 s each, 15 s total); up to
  3 audio clips (2–15 s each, 15 s total). Edge lengths in `[256, 5760]`, video aspect ratio
  5:2 to 2:5. **Audio must be paired with at least one image or video** — it cannot be the
  sole reference. Mixed inputs cap at 12 files total; with none, H3 falls back to
  Text-to-Video.

  | | Formats | Per-file size |
  |---|---|---|
  | Video | H.264/AVC, H.265/HEVC (embedded audio AAC or MP3) | 50 MB |
  | Image | JPG, JPEG, PNG, WEBP, HEIC, HEIF | 30 MB |
  | Audio | WAV, MP3 | 15 MB |

  Limits are per file. Keep the request body under 64 MB and prefer URL-based media for
  large assets.

  ## Install and launch

  The install panel above is authoritative and changes with the selected platform:

  1. Request model access and run the generated `hf download` command. Keep the complete
     repository under `/path/to/MiniMax-H3`; do not move the DiT subdirectories apart.
  2. Choose **Docker** or **pip**. The published H3 image predates the modular service, so
     Docker mounts current vLLM-Omni source and prepends it to `PYTHONPATH`. The pip path
     installs that same checkout editable.
  3. Run the generated serve command. Do not copy a static command from this guide: the
     matrix owns the task partition, GPU count, attention backend, and offload flags.
  4. Wait for `Application startup complete`, check `/health`, then run the generated cURL.

  `ffmpeg` and `ffprobe` must be on `PATH`. Validate every result before judging quality:

  ```bash
  curl --fail http://127.0.0.1:8000/health
  ffprobe -v error -show_entries \
    stream=index,codec_name,width,height,r_frame_rate,sample_rate,channels \
    -of json output.mp4
  ffmpeg -v error -i output.mp4 -map 0:v:0 -map 0:a:0 -f null -
  ```

  ## Precision: BF16 or online FP8

  **BF16 is the default accuracy reference.** [vLLM-Omni #5910](https://github.com/vllm-project/vllm-omni/pull/5910)
  adds one user-facing online mode. Selecting **FP8 (online)** appends
  `--quantization fp8`; no calibrated or pre-quantized checkpoint is required.

  | Component | Precision with global FP8 |
  |---|---|
  | DiT attention, MLP, conditioning, and AdaLN linears | online FP8 |
  | Qwen3-VL text-decoder attention and MLP linears | online FP8 |
  | Qwen vision tower, embeddings, norms, and RoPE | checkpoint precision |
  | Visual and audio VAEs | checkpoint precision |
  | Patch, timestep, and output projections declared FP32 | FP32 |

  “Global” therefore means every eligible compute-heavy linear, not every tensor. The
  mode is approximate and should not produce consistency ground truth.

  Current end-to-end FP8 validation is **B300 only**. Other FP8-capable hardware remains
  selectable for experimentation, but its latency, memory, video quality, and audio quality
  are pending target-hardware qualification.

  Single-B300 resident, eager, 5-second T2VA at 1344×768 and 50 steps:

  | Precision | Wall time | Worker peak |
  |---|---:|---:|
  | BF16 | 162.30 s | 133,110 MiB |
  | Global FP8 | 151.58 s | 92,146 MiB |
  | Change | **1.071× faster** | **40,964 MiB lower (30.8%)** |

  Across matched T2VA, I2VA, and Ref2VA cases, FP8 averaged **1.066×** speedup and
  **29.2%** lower request-peak memory. Compare the generated BF16/FP8 videos in the
  [side-by-side player](https://lishunyang12.github.io/vllm-omni-rankings/scripts/minimax_h3_global_fp8_vs_bf16/)
  and inspect the full [benchmark artifacts](https://github.com/lishunyang12/vllm-omni-rankings/tree/main/scripts/minimax_h3_online_fp8).

  Encoder-only steady-state latency showed no stable speedup; FP8's repeatable benefit is
  capacity. Complete-pipeline memory fell from 121.10 to 90.33 GiB at encoder TP1. In the
  four-GPU DLO startup benchmark, full-lifecycle peak fell from 58,696 to 37,938 MiB/GPU.

  FP8 is compatible with DLO only through the full-weight per-rank path. The generated DLO
  profiles already include `--dlo-no-use-allgather`; the sharded AllGather path cannot
  reconstruct weights quantized at runtime.

  ## Deployment profiles

  The **Hardware** choice is also the deployment-profile choice. The command matrix emits
  the validated topology; users normally should not tune TP, Ulysses, VAE parallelism, or
  DLO residency independently.

  | Profile | Placement and precision | Task scope | Use when |
  |---|---|---|---|
  | 4× B300 / GB200 | resident, BF16 default; B300 FP8 validated | both DiTs | lowest validated datacenter latency |
  | 4× RTX PRO 5000 | resident TP2 × Ulysses2, BF16 | one selected DiT | 72 GiB PCIe Blackwell |
  | 4× MI300X | resident Ulysses4 + AITER, BF16 | both DiTs | ROCm without CPU offload |
  | 4× MI355X | Ulysses4 + AITER + CPU offload, BF16 | both DiTs | qualified ROCm capacity path |
  | 2× RTX PRO 6000 | resident TP2, BF16 | one selected DiT | 96 GiB per GPU |
  | 2× RTX 5090 | TP2 + rank-local DLO, 20 resident DiT layers | one selected DiT | 32 GiB per GPU |
  | 2× RTX 4090 | TP2 + rank-local DLO, 12 resident DiT layers | one selected DiT | 24 GiB per GPU |

  ### Two-GPU distributed layerwise offload

  The RTX 5090/4090 profiles keep rank-local TP shards in pinned host memory and stream
  them with `--dlo-no-use-allgather`. The resident-layer count changes placement only; BF16
  DLO is lossless. Use a **384 GiB-class host**, expect PCIe transfer on every denoise step,
  and increase residency only after measuring peak HBM on the exact output shape.

  These profiles load one DiT. The request-mode picker adds `--task-type fl2va` or
  `--task-type ref2va`; restart the server to change task families. RTX 4090 starts at
  1024×576 and requires `aspect_ratio=16:9` in the request.

  ### Resident NVIDIA notes

  B300/GB200 uses four resident GPUs, Ulysses4, VAE tile parallelism 4, regional compile,
  and the datacenter Blackwell `TRTLLM_ATTN` default. Both DiTs remain loaded, so all seven
  request presets work without a server restart. Install `[fa4]` only for an explicit
  FlashAttention-4 comparison.

  RTX PRO 5000 uses TP2 × Ulysses2, text-encoder TP4, VAE tile parallelism 4, and
  `CUDNN_ATTN`. It loads one DiT. On the measured dual-socket host,
  `CUDA_VISIBLE_DEVICES=0,2,1,3` kept TP pairs on local PXB paths; use
  `nvidia-smi topo -m` to determine the order on another host.

  Its five-step topology screen after warmup produced valid H.264/AAC output:

  | Workload | Client E2E | Encode | Denoise | VAE decode | Peak/GPU |
  |---|---:|---:|---:|---:|---:|
  | T2VA, 124 frames, 1344×768 | 32.993 s | 0.034 s | 27.915 s | 4.307 s | 67.6 GiB |
  | FL2VA first frame, same shape | 30.130 s | 0.276 s | 24.396 s | 4.339 s | 67.6 GiB |

  These are five-step topology results, not 50-step throughput claims. Nsight aggregation
  for the same runs measured 24.09% / 23.91% total NCCL and 31.15% / 32.53% dense FMHA
  for T2VA / FL2VA, respectively; rank imbalance was 1.11% / 0.13%.

  ### AMD ROCm notes

  MI300X uses the ROCm H3 image, AITER packed attention, Ulysses4, text-encoder TP4,
  and VAE tile parallelism 4. MI355X uses the same topology with model-level CPU offload.
  Both root services accept T2VA, FL2VA, and Ref2VA without restart.

  The generated ROCm command sets `VLLM_ROCM_USE_AITER=1`; its `FLASH_ATTN` selection
  resolves to AITER on supported Instinct GPUs. Do not install CUDA-only `[fa4]` or set
  `FLASHINFER_DISABLE_VERSION_CHECK` on AMD.

  Keep these qualified constraints:

  - Do not add `--enforce-eager`; regional compile is the default and measured ~9.5%
    faster on MI355X. Warm once before measuring steady state.
  - Keep `--cfg-parallel-size 1`; H3 is CFG-distilled and has no negative branch.
  - Use VAE `tile` mode only. Patch parallel size must be 1 or the full DiT group size.
  - The refreshed ROCm image includes TorchCodec, FFmpeg, and the Ref2VA soundfile fallback.

  ## Advanced tuning

  ### Experimental single-GPU capacity

  [vLLM-Omni #5910](https://github.com/vllm-project/vllm-omni/pull/5910) includes a
  single-partition, global-FP8, no-offload script intended to test whether a 96 GB card can
  run the five-second workload. It completed on B300, but the
  matrix does not expose a one-card RTX PRO 6000 profile until that exact target passes.
  Use this only as a qualification procedure, not as a verified deployment recommendation.

  ### Text-encoder tensor parallelism

  By default the whole Qwen3-VL encoder is resident on the DiT main rank, making it the
  peak-memory hotspot on multi-GPU no-offload runs. `--text-encoder-tp-size N` shards it
  across the first `N` DiT ranks using vLLM-style tensor-parallel layers on a dedicated
  encoder process group. The hardware profiles already choose a qualified value; override it
  only when testing a new topology.

  - `N` must divide the Qwen3-VL head counts (64 attention heads / 8 KV heads) → 1, 2, 4 on
    a 4-GPU server; 1, 2, 4, 8 on 8 GPUs.
  - On 4 GPUs, `N=4` drops the per-rank engine peak from **133 GB to 103 GB** (~35.7 GB) at
    no measurable throughput cost, while each non-main rank gains ~51.5/N GB.
  - Numerically: `N=1` reproduces the HF reference path bit-exactly (`max_abs = 0`); `N=4`
    introduces bounded BF16 rounding only (row-parallel all-reduce in FP32), giving
    31.11 dB PSNR / 0.9566 SSIM end-to-end against `N=1` with identical structure.
  - Combining `N>1` with regional compile used to produce a `ValueError: v must be finite`
    on the *second* request. That is fixed — the token refiner's attention runs on
    replicated rows before `sp_prepare` and was wrongly getting a Ulysses SP all-to-all.

  ### Request controls

  | Parameter | Recommended | Notes |
  |---|---|---|
  | `task` | `t2va`, `fl2va`, `ref2va` | Passed inside `extra_params`; must be compatible with `--task-type` when one is set |
  | `duration` | 4–15 s | Decimal seconds in `extra_params`; snapped to H3's legal `17n+5` frame count (15 s → 362 frames / 15.083 s) |
  | `fps` | `24` | Output FPS is fixed |
  | `num_inference_steps` | `50` | Matches the reference accuracy workloads |
  | `flow_shift` | `12` | Video sigma shift |
  | `audio_flow_shift` | `3` | Audio sigma shift, in `extra_params` |
  | `width`, `height` | see below | Server-side validation: multiples of 32, aspect ratio 1:4 to 4:1 |
  | `seed` | fixed value | Output is deterministic per request at a fixed seed |

  On `width`/`height`, the serving-side check is broader than the documented product modes —
  pick a **short edge of 768 or 1440** in one of the supported ratios (21:9, 16:9, 4:3, 1:1,
  3:4, 9:16) to stay on shapes the model was trained and validated for. FL2VA can omit both
  and inherit the first frame's aspect ratio at a 768 px short edge. Prompts cap at 7,000
  characters.

  Use `POST /v1/videos/sync` when you want the MP4 in the response body; `POST /v1/videos`
  is the async job-polling variant.

  ## Benchmarks and quality

  ### 4×B300 BF16 resident

  These 50-step measurements used task-specific single-DiT processes before the modular
  combined-service merge; they remain validated per-task operating points, not a
  combined-service latency guarantee.

  | Workload | Config | Result |
  |---|---|---|
  | FL2VA, 209 frames, 1248×768 (8.7 s) | no offload, U4, VPP4 tile, regional compile | **86.96 s** client E2E (±0.23 s) |
  | Two-video Ref2VA, 362 frames, 1344×768 (15 s) | same | **784.4 s** accounted model-stage mean |

  Stage split for the FL2VA case: text encoder 0.21 s, visual encoder 0.20 s, DiT 79.1 s
  (**88%** of the request), video+audio VAE decode 2.40 s. VAE patch parallelism is the
  cheapest win available — it cuts decode 3.4–3.5× (8.24 s → 2.40 s).

  ### 4×MI300X BF16 resident

  Measured with `vllm/vllm-omni-rocm:minimax-h3`
  (`sha256:29d1946af9c69e3e0a7128c247bdc8c82437ead43fbc366fed443533cf6ce9e8`),
  BF16, AITER, U4, text-encoder TP4, VPP4 tile, regional compile, one warmup, and
  the synchronous Video API:

  | Workload | Model stages | Client E2E |
  |---|---:|---:|
  | T2VA, 209 frames, 1344×768 (8.7 s) | encode 0.09 s, denoise 244.04 s, decode 4.15 s | **267.42 s** |
  | FL2VA, 209 frames, 1344×768 (8.7 s) | encode 13.98 s, denoise 257.58 s, decode 4.11 s | **287.07 s** |

  Both outputs were validated as 209-frame H.264 at 24 FPS with 32 kHz stereo AAC.
  A v0.26.0 source build additionally completed image+audio and video-reference Ref2VA,
  plus a 2048×1088 T2VA run. These measurements describe tested shapes, not a general
  latency guarantee.

  A `with_stack` profile of the two-video Ref2VA case shows the pipeline is
  **GPU-attention-bound, not host-starved**: FlashAttention-4 is ~76% of `diffuse` device
  time, Ulysses send/recv is secondary, GPU utilization is 92.8–94.3% and the CPU-idle
  union inside the transformer forwards is 3.15%. Reducing DiT time further needs a change
  in attention complexity (reference-latent pooling/pruning, block-sparse attention), which
  is not lossless.

  Against the checkpoint's own reference implementation, the accuracy-qualified path scores
  SSIM 0.9873–0.9896, PSNR 39–42 dB, pixel cosine 0.9996+, and audio log-mel cosine
  0.977–0.996 on T2VA/FL2VA. The two-video Ref2VA composite scores lower on raw pixels
  (SSIM 0.628) largely because of H.264 bitrate differences, while CLIP cosine is 0.9816 and
  audio log-mel cosine 0.9869 — content and motion stay aligned.

  ### Approximate speedups: Cache-DiT

  Opt-in only. A 50-step T2VA probe cut denoise time **30.2%** (121.01 s → 84.47 s) but
  dropped SSIM to **0.831** against the uncached output. H3's video trajectory is sensitive
  to cached denoise steps — choose the cache budget against your own quality target.

  ### Placement and accuracy

  On a **single GPU**, model-level CPU offload is the accuracy-qualified path. On four GPUs,
  no-offload is both faster and accuracy-clean once the encoder stays resident: an earlier
  no-offload build performed a ~63 GiB DiT GPU→CPU→GPU round trip inside `encode_prompt`,
  which was pure overhead (encoder 30.38 s → 0.207 s once removed, ~146×).

  ## Troubleshooting and limits

  | Situation | What it means | Action |
  |---|---|---|
  | You need T2VA, FL2VA, and Ref2VA on one endpoint | Both DiTs must remain loaded | Use a qualified root-service profile such as B300/GB200 or the listed AMD paths |
  | A capacity profile rejects the selected task | It loaded one DiT with `--task-type` | Select a request from that family or restart with the other family |
  | A 24/32 GiB GPU pair OOMs | Pure Ulysses replicates the 66.3 GB DiT; encoder TP is not enough | Use the generated TP2+DLO profile and a 384 GiB-class host |
  | The first resident request is slower | Regional compile warms on the first request | Warm once before measuring; DLO profiles are eager and do not compile |
  | FP8 + DLO fails during loading | Runtime FP8 cannot use sharded AllGather reconstruction | Keep `--dlo-no-use-allgather`; it is already in the generated profile |
  | Ref2VA audio-only is rejected | H3 requires audio to accompany an image or video | Add a visual reference; do not expose audio-only as a request mode |
  | A hybrid U2 × Ring2 run hits an attention-mask mismatch | That topology is not supported | Use pure Ulysses from the generated profile |
  | CFG parallelism is rejected | H3 is CFG-distilled and has no negative branch | Keep `--cfg-parallel-size 1` |
  | VAE spatial-shard flags fail | H3 supports its native tiled VAE path only | Keep `--vae-parallel-mode tile` and patch degree 1 or the full DiT group |

  Additional limits:

  - H3 currently executes one generation request per diffusion batch.
  - The official Ref2VA maximum is 9 images, 3 videos, 3 audio clips, and 12 files total;
    audio must accompany a visual reference.
  - The 768-pixel short-edge mode is available for T2VA and FL2VA. Use 1344×768 for the
    documented 16:9 quality shape; the 24 GiB DLO preset starts at 1024×576.
  - FP8 is production-qualified only on B300 in this recipe. Re-run the same five-second
    matrix before promoting another hardware/precision combination.

  ## References

  - [Model card](https://huggingface.co/MiniMaxAI/MiniMax-H3)
  - [Modular FL2VA/Ref2VA pipeline (vLLM-Omni #5720)](https://github.com/vllm-project/vllm-omni/pull/5720)
  - [vLLM-Omni Video API](https://docs.vllm.ai/projects/vllm-omni/en/latest/serving/videos_api/)
  - [vLLM-Omni diffusion parallelism](https://docs.vllm.ai/projects/vllm-omni/en/latest/user_guide/diffusion/parallelism/overview/)
  - [vLLM-Omni diffusion attention backends](https://docs.vllm.ai/projects/vllm-omni/en/latest/user_guide/diffusion/attention_backends/)
  - [vLLM-Omni supported models](https://docs.vllm.ai/projects/vllm-omni/en/latest/models/supported_models/)
  - [vLLM-Omni GPU installation](https://docs.vllm.ai/projects/vllm-omni/en/latest/getting_started/installation/gpu/)
